---
# Workflow to publish the documentation of a release in a subfolder of the
# website, named after the pushed tag.
###
name: "DOCUMENTATION RELEASE"

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:

  build_and_deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.12
    - name: Install Latex
      run: |
        sudo -E apt-get -yq update
        sudo -E apt-get -yq --no-install-suggests --no-install-recommends install \
            dvipng texlive-latex-base texlive-latex-extra
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        python -m pip install --progress-bar off matplotlib seaborn nilearn tensorboard torchmetrics medmnist
        python -m pip install --progress-bar off .
        python -m pip install --progress-bar off .[openbhb]
        python -m pip install --progress-bar off .[doc]
    - name: Check the tag matches the package version
      run: |
        test "$(python -c 'import nidl; print(nidl.__version__)')" = "${{ github.ref_name }}"
    - name: Compute documentation
      env:
        DOC_SITE_ROOT: "../"
      run: |
        cd ./doc
        make html-strict
        cd ..
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: doc/_build/html
        destination_dir: ${{ github.ref_name }}
        keep_files: true
